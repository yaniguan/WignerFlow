# Fine-tune of the full-data argon run (argon_full_oct29) that diverged at the m=2 -> 4 curriculum jump.
# Starts from the most stable m<=2 snapshot (scripts/rank_snapshots.py; init_from is set by the notebook),
# then ramps the unroll length 2 -> 3 -> 4 with an LR re-warmup at each switch, every unroll step in the
# loss, a loss-spike guard, tighter gradient clipping, and the rollout-stability options of docs/STABILITY.md.
# Model selection: best_stable.pt (stability first, longer selection rollouts). See docs/ARGON_STABLE_FT.md.
data_dir: data/argon_full
stride_steps: 10
k: 3
seed: 1
model:
  head: flow
  lmax: 2
  channels: 64
  heads: 8
  n_rbf: 32
  cutoff: 6.0
  n_spatial: 2
  n_fusion: 2
  n_denoiser: 2
  parity: true
  use_velocity: true
  target: residual
  repulsion_prior:
    enabled: true
    strength: 0.5
    rmin_scale: 0.95
    width: 0.1
    n_iter: 2
    damp_velocity: 0.0
    percentile: 0.1
train:
  init_from: null          # set by the notebook to the chosen snapshot
  batch_size: 8
  lr: 0.0001               # 1/3 of the original peak; fine-tuning
  steps: 16000
  warmup: 300
  rewarmup_steps: 1000     # LR 0.1x -> 1x over 1000 steps after each unroll-length switch
  grad_clip: 0.5
  loss_spike_factor: 5.0   # skip updates with loss > 5x running median at the current m
  noise_schedule:
  - [0, 0.02]
  - [16000, 0.005]
  unroll:
  - [0, 2]
  - [3000, 3]
  - [8000, 4]
  backprop: truncated
  unroll_sampling_steps: 2
  unroll_loss_weights: [1.0, 1.0, 1.0, 1.0]   # loss on every unroll step, not only the last
  overlap_penalty:
    weight: 0.1
    rmin_scale: 1.0
  workers: 4
  start_every: 1
  ckpt_minutes: 10
eval:
  every: 2000
  eval_at_start: true
  val_batches: 20
  rollout_steps: 1000
  rollout_starts: 8
  rollout_steps_select: 2000
  rollout_starts_select: 8
  sampling_steps: 10
name: B_S3a_stable_ft
out_dir: results/argon/B_S3a_stable_ft
