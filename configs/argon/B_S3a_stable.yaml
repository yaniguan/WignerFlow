# B_S3a with the opt-in rollout-stability options (docs/STABILITY.md)
data_dir: data/argon
stride_steps: 10
k: 3
seed: 0
model:
  head: flow
  lmax: 2
  channels: 64
  heads: 8
  n_rbf: 32
  cutoff: 6.0
  n_spatial: 2
  n_fusion: 2
  n_denoiser: 2
  parity: true
  use_velocity: true
  target: residual
  repulsion_prior:
    enabled: true
    strength: 0.5
    rmin_scale: 0.95
    width: 0.1
    n_iter: 2
    damp_velocity: 0.0
    percentile: 0.1
train:
  batch_size: 8
  lr: 0.0003
  steps: 40000
  warmup: 1000
  grad_clip: 1.0
  noise_sigma: 0.01
  noise_schedule:
  - - 0
    - 0.03
  - - 20000
    - 0.01
  - - 40000
    - 0.005
  unroll:
  - - 0
    - 1
  - - 10000
    - 2
  - - 20000
    - 4
  backprop: truncated
  unroll_sampling_steps: 2
  unroll_loss_weights: [0.5, 0.75, 1.0, 1.5]
  overlap_penalty:
    weight: 0.1
    rmin_scale: 1.0
  workers: 4
  start_every: 1
  ckpt_minutes: 20
eval:
  every: 2000
  val_batches: 20
  rollout_steps: 1000
  rollout_starts: 4
  rollout_steps_select: 4000
  rollout_starts_select: 4
  sampling_steps: 10
name: B_S3a_stable
out_dir: results/argon/B_S3a_stable
