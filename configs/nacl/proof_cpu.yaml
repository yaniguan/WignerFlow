# CPU proof: multi-species (Na/Cl) pipeline with stability options on.
name: nacl_proof_cpu
data_dir: data/nacl_proof
stride_steps: 10
k: 3
model: {head: flow, lmax: 2, channels: 16, heads: 2, n_rbf: 8, cutoff: 6.0, n_spatial: 1, n_fusion: 1, n_denoiser: 1,
        repulsion_prior: {enabled: true, strength: 0.5, rmin_scale: 0.95, width: 0.1, n_iter: 2, percentile: 0.1}}
train: {batch_size: 4, lr: 1.0e-3, steps: 600, warmup: 50, noise_sigma: 0.01, unroll: [[0, 1], [300, 3]],
        unroll_loss_weights: [0.5, 1.0, 1.5], overlap_penalty: {weight: 0.1, rmin_scale: 1.0},
        backprop: truncated, workers: 0, start_every: 5}
eval: {every: 200, val_batches: 4, rollout_steps: 200, rollout_starts: 2, sampling_steps: 2, rollout_steps_select: 500, rollout_starts_select: 2}
out_dir: results/nacl/proof_cpu
