# Dipolar-bead WignerFlow model for `best-napf6-ec-dmc-m4a` (8,264 sites -> 1,140 beads at 100 fs stride).
# Splits EC and DMC into [carbonyl-O, scaffold-COM] dipolar dimers + Na+ and PF6- ions to resolve first-shell Na+-O coordination.
data_dir: data/napf6_ec_dmc_polar100
stride_steps: 1
k: 3
seed: 1
model:
  arch: equi
  head: flow
  lmax: 2
  channels: 80
  heads: 8
  n_rbf: 32
  cutoff: 7.5
  n_spatial: 2
  n_fusion: 2
  n_denoiser: 2
  parity: true
  use_velocity: true
  neighbor_method: auto
  gradient_checkpointing: true
  target: residual
  target_scaling: mass
  n_ff_types: auto
  use_charges: true
  max_bond_hops: 1
  repulsion_prior:
    enabled: true
    strength: 0.5
    rmin_scale: 0.92
    width: 0.12
    n_iter: 2
    percentile: 0.2
train:
  batch_size: 4
  amp: bf16
  matmul_precision: high
  ema_decay: 0.999
  lr: 0.0002
  steps: 30000
  warmup: 1200
  rewarmup_steps: 800
  grad_clip: 0.5
  loss_spike_factor: 5.0
  noise_schedule:
    - [0, 0.02]
    - [30000, 0.005]
  unroll:
    - [0, 1]
    - [10000, 2]
    - [20000, 4]
  backprop: truncated
  unroll_sampling_steps: 2
  unroll_loss_weights: [1.0, 1.0, 1.0, 1.0]
  overlap_penalty:
    weight: 0.1
    rmin_scale: 0.95
  verlet_skin: 1.0
  workers: 4
  start_every: 1
  ckpt_minutes: 15
eval:
  every: 2000
  val_batches: 16
  rollout_steps: 500
  rollout_starts: 4
  rollout_steps_select: 1000
  rollout_starts_select: 4
  sampling_steps: 4
name: napf6_ec_dmc_polar100_h100
out_dir: results/napf6_ec_dmc/polar100_seed1
