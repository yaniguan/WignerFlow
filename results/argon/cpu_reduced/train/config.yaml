data_dir: data/argon
eval:
  every: 250
  rollout_starts: 1
  rollout_steps: 10
  sampling_steps: 2
  val_batches: 2
k: 3
model:
  channels: 64
  cutoff: 6.0
  head: flow
  heads: 8
  lmax: 2
  n_denoiser: 2
  n_fusion: 2
  n_rbf: 32
  n_spatial: 2
  parity: true
  target: residual
  use_velocity: true
name: B_S3a_cpu_reduced
out_dir: results/argon/cpu_reduced/train
seed: 1
stride_steps: 10
train:
  backprop: truncated
  batch_size: 1
  ckpt_minutes: 5
  grad_clip: 1.0
  lr: 0.0003
  noise_sigma: 0.01
  start_every: 1
  steps: 1000
  unroll:
  - - 0
    - 1
  - - 600
    - 2
  - - 900
    - 4
  unroll_sampling_steps: 2
  warmup: 100
  workers: 0
