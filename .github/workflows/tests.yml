name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "e3nn==0.4.4" "numpy<2.5" scipy h5py matplotlib pyyaml ase mdtraj openmm pytest
      - name: pytest (CPU; GPU-only tests skip themselves)
        run: python -m pytest -q
