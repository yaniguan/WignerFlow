<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="105" height="50" viewBox="0 0 105 50"
     role="img" aria-labelledby="wf-emblem-title" aria-describedby="wf-emblem-desc" focusable="false">
  <title id="wf-emblem-title">WignerFlow</title>
  <desc id="wf-emblem-desc">Continuous Wigner-D harmonic phase loop with two counter-phased equivariant wavepackets.</desc>
  <style>
    .wf-trail-a { animation: wf-travel-a 7.5s linear infinite; }
    .wf-head-a  { animation: wf-head-a 7.5s linear infinite; }
    .wf-trail-b { animation: wf-travel-b 7.5s linear infinite; }
    .wf-head-b  { animation: wf-head-b 7.5s linear infinite; }
    @keyframes wf-travel-a { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1000; } }
    @keyframes wf-head-a   { from { stroke-dashoffset: -52; } to { stroke-dashoffset: -1052; } }
    @keyframes wf-travel-b { from { stroke-dashoffset: -500; } to { stroke-dashoffset: -1500; } }
    @keyframes wf-head-b   { from { stroke-dashoffset: -552; } to { stroke-dashoffset: -1552; } }
    @media (prefers-reduced-motion: reduce) {
      .wf-trail-a, .wf-head-a, .wf-trail-b, .wf-head-b { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="wf-grad" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="97" y2="42">
      <stop offset="0%" stop-color="#79c2bd"/>
      <stop offset="48%" stop-color="#b5d88e"/>
      <stop offset="100%" stop-color="#b9a1de"/>
    </linearGradient>
    <path id="wf-orbital" pathLength="1000"
          d="M 52.5 25.0
             C 64.5 10.2, 95.5 9.8, 95.5 25.0
             C 95.5 40.2, 64.5 39.8, 52.5 25.0
             C 40.5 10.2, 9.5 9.8, 9.5 25.0
             C 9.5 40.2, 40.5 39.8, 52.5 25.0 Z"/>
    <ellipse id="wf-ring" cx="52.5" cy="25" rx="22" ry="18.5" transform="rotate(-24 52.5 25)"/>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#wf-ring" stroke="#91b6df" stroke-width="1.15" stroke-dasharray="3 4" opacity="0.42"/>
    <use href="#wf-orbital" stroke="url(#wf-grad)" stroke-width="2.1" opacity="0.82"/>
    <use href="#wf-orbital" class="wf-trail-a" stroke="url(#wf-grad)" stroke-width="3.0" stroke-dasharray="52 948" opacity="0.85"/>
    <use href="#wf-orbital" class="wf-head-a" stroke="#f3f9ec" stroke-width="4.6" stroke-dasharray="0.5 999.5"/>
    <use href="#wf-orbital" class="wf-trail-b" stroke="url(#wf-grad)" stroke-width="2.8" stroke-dasharray="52 948" opacity="0.75"/>
    <use href="#wf-orbital" class="wf-head-b" stroke="#e9f2ff" stroke-width="4.2" stroke-dasharray="0.5 999.5"/>
  </g>
</svg>
